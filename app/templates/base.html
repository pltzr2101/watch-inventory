<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Watch-Inventory{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b0d0c' stroke='%23c9a35c' stroke-width='2'/%3E%3Cline x1='16' y1='8' x2='16' y2='16' stroke='%23c9a35c' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='16' y1='16' x2='21.5' y2='19' stroke='%23e3c27e' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%23e3c27e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Watch&#8209;Inventory</a>
  {% if is_logged_in %}
  <nav class="mainnav">
    <a href="/">Übersicht</a>
    <a href="/watches">Bestand</a>
    {% if wecatalog_enabled %}<a href="/imports">Importe</a>{% endif %}
    <a href="/templates">Vorlagen</a>
  </nav>
  <form method="post" action="/logout" class="logout-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="btn btn-ghost">Abmelden</button>
  </form>
  {% endif %}
</header>
<main class="container">
  {% for f in flashes %}
  <div class="flash flash-{{ f.level }}">{{ f.text }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
